---
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opensafely-core/setup-action@fc0f6e03d1a6fe8c53ff686b310dd08be072b8c8 # v1.9.0
        with:
          install-just: true
      - name: Lint and check renovate config
        run: just check
